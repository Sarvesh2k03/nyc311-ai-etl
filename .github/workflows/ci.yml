name: CI

# Two things have to stay true on every push: the Python logic passes its tests,
# and the dbt project still parses and its models still compile. The second one
# catches a broken ref or a dialect-specific function long before anyone runs a
# pipeline.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests and dbt build
    runs-on: ubuntu-latest
    env:
      WAREHOUSE: duckdb
      DBT_TARGET: duckdb
      DUCKDB_PATH: ${{ github.workspace }}/warehouse/ci.duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt/nyc311

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Unit and dashboard tests
        run: pytest tests/ -v

      - name: dbt parse
        working-directory: dbt/nyc311
        run: dbt parse --profiles-dir .

      - name: Build and test dbt models on a seeded batch
        # Uses a single small batch so CI stays fast while still exercising the
        # real models, the incremental logic and the full test suite.
        run: |
          mkdir -p warehouse
          python -m pipeline.cli extract --batch-date 2024-01-15 --row-limit 2000
          python -m pipeline.cli map-and-load --batch-date 2024-01-15 --batch-id ci
          python -m pipeline.cli dbt run
          python -m pipeline.cli dbt test
          python -m pipeline.cli report --batch-date 2024-01-15 --batch-id ci

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/
          if-no-files-found: ignore
